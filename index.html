function mat(color,roughness=.75,metalness=.05,emissive=null){
  return new THREE.MeshStandardMaterial({
    color,roughness,metalness,
    emissive:emissive||color,
    emissiveIntensity:emissive?.5:0
  });
}

function box(parent,x,y,z,sx,sy,sz,color,round=false){
  const geometry = new THREE.BoxGeometry(sx,sy,sz);
  const mesh = new THREE.Mesh(geometry,mat(color));
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function sphere(parent,x,y,z,r,color,detail=1){
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(r,detail),mat(color)
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

function cylinder(parent,x,y,z,rt,rb,h,color,segments=8){
  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(rt,rb,h,segments),
    mat(color)
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

function torus(parent,x,y,z,r,t,color){
  const mesh=new THREE.Mesh(
    new THREE.TorusGeometry(r,t,8,64),
    new THREE.MeshStandardMaterial({
      color,emissive:color,emissiveIntensity:.7,
      metalness:.5,roughness:.3
    })
  );
  mesh.rotation.x=Math.PI/2;
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

function glowRing(parent,x,y,z,r,color){
  const ring=torus(parent,x,y,z,r,.055,color);
  animated.push({obj:ring,type:'rotate'});
  return ring;
}

function addLabel(parent,text,isMain=false){
  const el=document.createElement('div');
  el.className='island-label'+(isMain?' main':'');
  el.textContent=text;
  const label=new CSS2DObject(el);
  label.position.set(0,4.1,0);
  parent.add(label);
  labels.push(label);
  return label;
}

/* =========================================
   6. 建造島嶼
========================================= */

function createIsland(data,index){
  const group=new THREE.Group();
  group.position.set(...data.position);
  group.userData.subject=data;
  scene.add(group);

  const isMain=data.id==='main';
  const radius=isMain?5.3:3.25;

  // 六角形浮島底座
  const base=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius*.91,radius, isMain?1.5:1.1,6,1
    ),
    mat(isMain?0x275b82:0x356c85,.65,.2)
  );
  base.position.y=-.7;
  base.rotation.y=Math.PI/6;
  base.castShadow=true;
  group.add(base);

  const top=new THREE.Mesh(
    new THREE.CylinderGeometry(radius*.91,radius*.91,.3,6),
    mat(isMain?0x8dd9d4:0x8ce0d2)
  );
  top.position.y=.1;
  top.rotation.y=Math.PI/6;
  top.receiveShadow=true;
  group.add(top);

  // 島嶼下方懸浮岩石
  for(let j=0;j<7;j++){
    const a=j*Math.PI*2/7;
    const rock=sphere(group,
      Math.cos(a)*radius*.65,-1.4,
      Math.sin(a)*radius*.65,.6,0x426e8c,0);
    rock.scale.set(1,.75,1);
  }

  // 發光邊緣
  const edge=torus(group,0,.05,0,radius*.9,.075,data.color);
  animated.push({obj:edge,type:'rotate'});

  // 外環
  glowRing(group,0,.35,0,radius*.7,0x5beaff);

  if(isMain){
    buildMain(group);
  } else {
    buildSubject(group,data,index);
  }

  addLabel(group,data.name,isMain);
  islands.push(group);
  return group;
}

function buildMain(g){

function getIslandHit(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(
    islands.flatMap(g=>g.children),true
  );
  if(!hits.length)return null;
  let obj=hits[0].object;
  while(obj && !obj.userData.subject)obj=obj.parent;
  return obj || null;
}

renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons)return;
  const hit=getIslandHit(e);
  const next=hit;
  if(hovered!==next){
    hovered=next;
    document.body.style.cursor=next?'pointer':'default';
  }
});

renderer.domElement.addEventListener('click',e=>{
  const hit=getIslandHit(e);
  if(hit)selectIsland(hit);
});

function selectIsland(group){
  selected=group;
  const data=group.userData.subject;
  if(!data)return;

  document.getElementById('subjectEmoji').textContent=data.emoji;
  document.getElementById('subjectName').textContent=data.name;
  document.getElementById('subjectDesc').textContent=data.desc;

  const quick=document.getElementById('quick');
  quick.innerHTML='';
  data.questions.forEach(q=>{
    const b=document.createElement('button');
    b.textContent='✦ '+q;
    b.onclick=()=>askQuestion(q);
    quick.appendChild(b);
  });

  document.getElementById('chat').innerHTML=
    `<div class="msg ai">你好！我是你的${data.name}專屬 AI 家教 👋
今天我們一起把不懂的觀念弄清楚吧！
你可以選擇上方的快速提問，或直接輸入問題。</div>`;

  document.getElementById('panel').classList.add('open');
  document.getElementById('hint').style.display='none';

  const pos=new THREE.Vector3();

    from:camera.position.clone(),

  if(!selected)return;
  document.getElementById('question').value='';
  addMessage(q,'user');

  const thinking=addMessage('AI 家教思考中...','ai thinking');
  thinking.innerHTML='AI 家教思考中 <span class="dots"><span>●</span><span>●</span><span>●</span></span>';

  setTimeout(()=>{

    addMessage(generateTutorReply(
      selected.userData.subject,q
    ),'ai');
  },900+Math.random()*700);

${q.includes('牛頓')?'牛頓第二運動定律：F=ma。合力等於質量乘以加速度。當質量固定時，合力越大，加速度也越大。':'記住：物理公式不是孤立的數字，要理解每個物理量代表的意義。'}`+common,

    chemistry:
`🧪【化學家教解析】

化學題目建議依照以下流程：

① 確認反應物與生成物。
② 寫出正確的化學反應式。
③ 檢查原子數量是否守恆。
④ 依照莫耳比例進行計算。

${q.includes('酸鹼')?'酸鹼中和反應中，酸提供的 H⁺ 與鹼提供的 OH⁻ 可以形成水。':'化學計算時要特別注意莫耳數、質量與反應係數之間的比例。'}`+common,

    biology:
`🧬【生物家教解析】

生物學習要掌握結構與功能的關係：

① 先認識生物構造。
② 理解各構造的功能。
③ 建立生理過程的先後順序。
④ 連結遺傳、環境與演化。

${q.includes('孟德爾')?'孟德爾遺傳法則的重要概念包括分離律與獨立分配律。單因子雜交中，Aa × Aa 的基因型比例為 1:2:1，完全顯性時表現型比例為 3:1。':'學習細胞時，可以用構造、位置、功能三欄表整理細胞器。'}`+common,

    earth:
`🌋【地球科學家教解析】

地球科學可以分成四個系統：

① 固體地球：岩石、地層與板塊。
② 大氣系統：氣壓、風與天氣。
③ 海洋系統：洋流與海氣交互作用。
④ 天文系統：行星、恆星與宇宙。

${q.includes('板塊')?'板塊交界可分為聚合型、張裂型與錯動型，不同交界會產生不同的地震、火山與地形現象。':'學習地球科學時，要注意時間尺度與空間尺度，許多地球變化需要長時間才能觀察。'}`+common,

    main:

我們可以先確定學習目標，再安排學習路線：

你今天最想挑戰哪一個學科呢？`
  };

  return (replies[id]||replies.main);

/* =========================================
   11. 日夜模式
========================================= */

const modeBtn=document.getElementById('modeBtn');

modeBtn.onclick=()=>{
  night=!night;

  if(night){
    scene.background=new THREE.Color(0x061127);
    scene.fog.color.set(0x061127);
    oceanMaterial.color.set(0x061d46);
    oceanMaterial.emissive=new THREE.Color(0x063e6a);
    oceanMaterial.emissiveIntensity=.5;
    sun.intensity=.45;
    ambient.intensity=.8;
    modeBtn.textContent='☀️ 切換日景';
    document.documentElement.style.setProperty(
      '--glass','rgba(3,10,31,.88)'
    );
    document.querySelectorAll('.island-label').forEach(el=>{
      el.style.background='rgba(3,12,35,.9)';
      el.style.boxShadow='0 0 22px rgba(75,223,255,.65)';
    });
  }else{
    scene.background=new THREE.Color(0x8bd8ef);
    scene.fog.color.set(0x8bd8ef);
    oceanMaterial.color.set(0x168eb6);
    oceanMaterial.emissive=new THREE.Color(0x000000);
    oceanMaterial.emissiveIntensity=0;
    sun.intensity=2.5;
    ambient.intensity=.45;
    modeBtn.textContent='🌙 切換夜景';
    document.documentElement.style.setProperty(
      '--glass','rgba(13,31,61,.78)'
    );
    document.querySelectorAll('.island-label').forEach(el=>{
      el.style.background='rgba(8,25,52,.78)';
      el.style.boxShadow='0 0 18px rgba(57,207,255,.3)';
    });
  }
};

/* =========================================
   12. 動態動畫
========================================= */

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // 海面波浪
  for(let i=0;i<oceanPositions.count;i++){
    const x=oceanPositions.getX(i);
    const y=oceanPositions.getY(i);
    oceanPositions.setZ(
      i,
      originalOcean[i]+
      Math.sin(x*.32+t*.7)*.065+
      Math.cos(y*.3+t*.6)*.055
    );
  }
  oceanPositions.needsUpdate=true;
  oceanGeometry.computeVertexNormals();

  // 雲朵、粒子、建築
  animated.forEach(a=>{
    const o=a.obj;
    if(a.type==='cloud'){
      o.position.x+=Math.sin(t*.12+a.phase)*.001;
      o.position.y+=Math.sin(t*.45+a.phase)*.002;
    }
    if(a.type==='particle'){
      o.position.y+=Math.sin(t+a.phase)*.002;
    }
    if(a.type==='rotate')o.rotation.y+=.003;
    if(a.type==='tilt')o.rotation.z+=.004;
    if(a.type==='tilt2')o.rotation.x+=.003;
    if(a.type==='robot'){
      o.position.y=2.8+Math.sin(t*1.7)*.22;
      o.rotation.y=Math.sin(t*.6)*.12;
    }
    if(a.type==='crystal'){
      o.rotation.y+=.015;
      o.rotation.x+=.009;
      o.position.y=.9+Math.sin(t*1.4)*.15;
    }
    if(a.type==='swing'){
      o.rotation.z=Math.sin(t*1.8+a.phase)*.15;
    }
  });

  // 飛船沿橢圓軌道巡航
  shipAngle+=.0035;
  const sx=Math.cos(shipAngle)*19;
  const sz=Math.sin(shipAngle)*17;
  const sy=6.3+Math.sin(t*1.7)*.55;
  ship.position.set(sx,sy,sz);
  ship.rotation.y=-shipAngle;
  ship.rotation.z=Math.sin(t*1.5)*.045;

  // 引擎光效
  const glow=.6+Math.sin(t*8)*.3;
  engine1.scale.setScalar(glow);
  engine2.scale.setScalar(glow);

  // 相機平滑飛行
  if(cameraFlight){
    const f=cameraFlight;
    const p=Math.min((performance.now()-f.start)/f.duration,1);
    const smooth=p*p*(3-2*p);
    camera.position.lerpVectors(f.from,f.to,smooth);
    controls.target.lerpVectors(
      f.targetFrom,f.targetTo,smooth
    );
    if(p>=1)cameraFlight=null;
  }

  // 飛船追蹤模式
  if(followShip&&!cameraFlight){
    const shipPos=ship.position.clone();
    const desired=shipPos.clone().add(followOffset);
    camera.position.lerp(desired,.035);
    controls.target.lerp(shipPos,.045);
  }

  // 島嶼浮起及懸停亮度
  islands.forEach(g=>{
    const isSelected=g===selected;
    const isHovered=g===hovered;
    const target=(isSelected||isHovered)? .18:0;
    g.position.y+=(target-g.userData.hoverY||0)*.08;
    g.userData.hoverY=(g.userData.hoverY||0)+
      (target-(g.userData.hoverY||0))*.08;

    const s=isHovered||isSelected?1.025:1;
    const current=g.scale.x;
    const next=current+(s-current)*.08;
    g.scale.setScalar(next);
  });

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* =========================================
   13. RWD 與啟動
========================================= */

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

animate();

setTimeout(()=>{
  const loader=document.getElementById('loading');
  loader.style.opacity='0';
  setTimeout(()=>loader.remove(),650);
},800);

</script>
